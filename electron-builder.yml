appId: com.matheusvellone.fichario
productName: Fichário
directories:
  buildResources: build
files:
  - out/**
  - package.json
asarUnpack:
  - '**/*.node'
win:
  target: nsis
  executableName: Fichario
  # Nome fixo para o link releases/latest/download/Fichario-Setup.exe funcionar sempre
  artifactName: Fichario-Setup.${ext}
nsis:
  oneClick: true
  perMachine: false
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: Fichário
  runAfterFinish: true
  deleteAppDataOnUninstall: false
mac:
  target: dmg
publish:
  provider: github
  owner: matheusvellone
  repo: fichario
  releaseType: release
