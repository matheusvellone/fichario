name: Release

on:
  push:
    tags: ['v*']
  # Permite refazer a publicação de uma tag que já existe
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag a publicar (ex.: v1.0.0)'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Gera o instalador e o latest.yml em dist/, sem publicar
      - run: pnpm dist:win

      # O electron-builder publica os arquivos em paralelo e cada um tenta criar a release
      # ("already_exists"); por isso a release é criada e preenchida pelo gh
      - name: Publicar no GitHub Releases
        shell: bash
        run: |
          gh release view "$TAG" > /dev/null 2>&1 || gh release create "$TAG" --title "$TAG" --notes ""
          gh release upload "$TAG" dist/*.exe dist/*.exe.blockmap dist/latest.yml --clobber
